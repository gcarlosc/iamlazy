# iamlazy price table — one model per line:
#
#   <model_id>  <input_$_per_MTok>  <output_$_per_MTok>
#
# Cache is derived from the input price with the standard multipliers, so it is
# not listed: cache write = input x1.25, cache read = input x0.1.
#
# WHY THIS FILE EXISTS. The run log used to report `tokens_weighted`, a synthetic
# unit (output x5 + cache_write x1.25 + cache_read x0.1) that normalised every
# model to input-token-equivalents. It was arithmetically correct and still
# misleading in two ways, both measured on a real run 2026-09-05:
#
#   - It is BLIND TO THE MODEL. That run was 86% Sonnet-weighted and 14% Opus.
#     Priced entirely at Opus rates the same figure reads $6.07, at Sonnet rates
#     $2.43; the truth was $3.02. Two runs with an identical weighted number can
#     cost twice as much as each other, so the unit cannot rank cost across runs
#     that differ in model mix -- which is exactly what it was being used for.
#   - "1.21M tokens" reads as "consumed 1.21M tokens". The run really moved ~6M
#     tokens, 93% of them cache reads. The weighted figure was the DEFLATED one,
#     and every reader took it for the inflated one.
#
# Dollars have neither problem. The cost is model-aware by construction and
# nobody misreads a dollar.
#
# KEEPING IT HONEST. Prices go stale, and a stale number in a file this project
# reads is the failure mode it distrusts most. Three defences:
#   1. This is config, not code -- edit it without reinstalling.
#   2. A model that is NOT listed here makes the whole run report `cost_usd:
#      null` plus the offending model name. It never prices part of a run and
#      calls it the total: a partial sum presented as the cost is exactly the
#      "confidently wrong field" this project has shipped twice already.
#   3. The log also stores the raw token components, so any run can be repriced
#      from the record after this table is corrected.
#
# Rates below are Anthropic first-party API, verified 2026-09-05. Bedrock and
# Vertex are partner-operated and priced separately -- if you run there, edit.

