# iamlazy models — sourceable KEY="value" pairs, one line each.
# Per-tool mapping: Claude Code takes bare Anthropic model ids or aliases;
# OpenCode takes "provider/model" strings exactly as `opencode models` lists them.
#
# EMPTY IS THE DEFAULT, and it means "the host decides" (2026-10-03). Every value
# here used to be pinned -- claude-opus-5, opencode-go/kimi-k2.7-code -- and a
# pinned id is a command that fails for anyone without access to that exact
# model, which for a public install is nearly everyone. Empty means:
#
#   Claude Code  /iamlazy runs on your SESSION model; the Critic gets
#                `model: inherit`, the session's model too. `inherit` and not an
#                omitted line: per the sub-agent docs an omitted model lets
#                CLAUDE_CODE_SUBAGENT_MODEL decide, and `inherit` outranks it.
#   OpenCode     the iamlazy agent runs on your globally configured model; the
#                Critic, a subagent, on the model of the agent that invoked it
#                (both per opencode.ai/docs/agents).
#
# Pin one with `./install.sh --tool=<tool> --model=<id>` (sets both roles and
# persists here), or edit a line and re-run ./install.sh.
#
# --- How far a pin reaches on Claude Code ---
# A command's `model:` frontmatter overrides the model FOR THE CURRENT TURN ONLY;
# the session model resumes at the human's next prompt. iamlazy is multi-turn by
# construction -- the gate IS a human turn -- so a pinned CC_MAIN_MODEL covers the
# planner turn and the SESSION model covers the builder. A sub-agent's model, the
# Critic's, holds for its whole run. To route planner and builder separately, set
# the session model to `opusplan` in ~/.claude/settings.json: Opus in plan mode,
# Sonnet on execution, and the switch lands on the gate because the gate rides
# native plan mode.
#
# The Critic is the part of the harness that has caught real defects a passing
# suite did not, so if you pin anything, pin it to a strong model.

# --- Claude Code (Anthropic) ---
CC_MAIN_MODEL=""
CC_CRITIC_MODEL=""
# The Critic's effort: low | medium | high | xhigh | max, written as `effort:`
# in its frontmatter. Empty inherits the session's. At the session's xhigh a
# real review took nine minutes over 37 sequential turns (sperant,
# 2026-10-02); `high` is the first thing to try if reviews feel slow.
CC_CRITIC_EFFORT=""

# --- OpenCode ---
# Needs whatever credential your provider requires, configured by you (env or
# opencode.json). The installer writes models; it never configures credentials.
#
# The gate sends analysis to OpenCode's built-in `plan` agent, which pins no
# model and inherits the LIVE session model, the one entering `iamlazy` set
# (measured 2026-09-11). To split planner and builder, pin the built-in agent in
# your OWN opencode.json: "agent": { "plan": { "model": "..." } }.
OC_MAIN_MODEL=""
OC_CRITIC_MODEL=""
