# iamlazy models — sourceable KEY="value" pairs, one line each.
# Per-tool mapping: Claude Code uses Anthropic; OpenCode uses opencode-go.
#
# Claude Code takes bare Anthropic model ids or aliases.
# OpenCode takes "provider/model" strings exactly as `opencode models` lists them.
# Edit these values to taste; the installer projects them into the frontmatter.
#
# --- How far each knob actually reaches (Claude Code) ---
# A command's `model:` frontmatter overrides the model FOR THE CURRENT TURN ONLY;
# the session model resumes at the human's next prompt. iamlazy is multi-turn by
# construction — the gate IS a human turn — so:
#
#   CC_MAIN_MODEL   covers the planner turn (A1-A3, composed before the gate).
#   The SESSION model covers the builder (A4-A5), not this file.
#   CC_CRITIC_MODEL is durable: a subagent's model holds for its whole run.
#
# To route planner and builder separately, set your SESSION model to `opusplan`
# (`/model opusplan`, or "model" in ~/.claude/settings.json). It runs Opus during
# plan mode and switches to Sonnet on execution — and iamlazy's gate rides on
# native plan mode, so the switch lands exactly on the plan/build boundary.
# CC_MAIN_MODEL below then acts as a floor: a strong planner even if the session
# is on something cheap.
#
# Warning: the CLAUDE_CODE_SUBAGENT_MODEL env var, when set, overrides
# CC_CRITIC_MODEL silently. Unset it if you want the value below to apply.

# --- Claude Code (Anthropic) ---
# Adopted 2026-08-27: "model": "opusplan" in ~/.claude/settings.json, so Opus
# plans and Sonnet executes. The switch lands exactly on the gate because the
# gate rides native plan mode -- the contract is written by the stronger model,
# the code by the cheaper one. This is a SESSION setting: putting it in a
# project's .claude/settings.json only routes that project, which is why
# rotaturno ran entirely on the session default before this was moved global.
CC_MAIN_MODEL="claude-opus-5"
# This now governs EVERY review: the reviewer is always a sub-agent, and a
# sub-agent's model holds for its whole run, so `opusplan` cannot silently
# downgrade it the way it used to when reviews ran on the main thread.
# Keep it on Opus. Measured over three real runs the reviewer costs ~21k tokens
# -- about 2% of a run -- and found two [HIGH] bugs that the passing test
# suites did not: UTC-offset timestamps silently dropping data, and a default
# .sort() ordering by UTF-16 code unit in a Spanish-language project. It is the
# cheapest part of the harness and the only one that has caught production bugs.
CC_CRITIC_MODEL="claude-opus-5"

# --- OpenCode (opencode-go) ---
# Requires whatever credential that provider needs, configured by you (env or
# opencode.json). The installer writes the model; it does NOT configure creds.
#
# Reach, verified 2026-09-11 with `opencode debug agent`: an agent's frontmatter
# `model:` PINS that agent, so OC_MAIN_MODEL holds for everything running as the
# `iamlazy` agent -- contract, execution, close. Analysis does not run there: the
# gate sends you to OpenCode's built-in `plan` agent first, and that one pins no
# model, so it inherits your OpenCode DEFAULT. Setting the analysis model is
# therefore YOUR config, not this file's.
#
# Which makes OC_MAIN_MODEL the builder in practice, and the split the mirror of
# `opusplan` on the other host: a strong model reviews, a cheap one writes.
OC_MAIN_MODEL="opencode-go/kimi-k2.7-code"
# Durable like CC_CRITIC_MODEL, and for the same reason: a sub-agent's model
# holds for its whole run. Kept on the stronger model -- the reviewer is the
# part that has caught production bugs, and decorrelating it from the builder
# is the point: a reviewer sharing the builder's blind spots sees nothing.
OC_CRITIC_MODEL="opencode-go/deepseek-v4-pro"
