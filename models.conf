# iamlazy models — sourceable KEY="value" pairs, one line each.
# Per-tool mapping: Claude Code uses Anthropic; OpenCode uses DeepSeek.
#
# Claude Code takes bare Anthropic model ids or aliases.
# OpenCode takes "provider/model" strings exactly as `opencode models` lists them.
# Edit these values to taste; the installer projects them into the frontmatter.
#
# --- How far each knob actually reaches (Claude Code) ---
# A command's `model:` frontmatter overrides the model FOR THE CURRENT TURN ONLY;
# the session model resumes at the human's next prompt. iamlazy is multi-turn by
# construction — the gate IS a human turn — so:
#
#   CC_MAIN_MODEL   covers the planner turn (A1-A3, composed before the gate).
#   The SESSION model covers the builder (A4-A5), not this file.
#   CC_CRITIC_MODEL is durable: a subagent's model holds for its whole run.
#
# To route planner and builder separately, set your SESSION model to `opusplan`
# (`/model opusplan`, or "model" in ~/.claude/settings.json). It runs Opus during
# plan mode and switches to Sonnet on execution — and iamlazy's gate rides on
# native plan mode, so the switch lands exactly on the plan/build boundary.
# CC_MAIN_MODEL below then acts as a floor: a strong planner even if the session
# is on something cheap.
#
# Warning: the CLAUDE_CODE_SUBAGENT_MODEL env var, when set, overrides
# CC_CRITIC_MODEL silently. Unset it if you want the value below to apply.

# --- Claude Code (Anthropic) ---
CC_MAIN_MODEL="claude-opus-5"
# IMPORTANT: this only governs the `subagent` mode — 12 of 29 logged runs. The
# other 58% review `inline` or `same-thread-reset`, which run ON THE MAIN THREAD
# and therefore use the SESSION model, not this value. With `opusplan` that means
# the Critic reviews on Sonnet after the gate, whatever you set here. Measured,
# not theorised: run b5b8d46c logged critic_model=claude-sonnet-5 against this
# very setting. Whether the Critic should be DECORRELATED from the builder —
# and how, given there is no knob for the non-subagent modes — see DELTAS.md.
CC_CRITIC_MODEL="claude-opus-5"

# --- OpenCode (DeepSeek) ---
# Requires a DeepSeek credential configured by you (env or opencode.json).
# The installer writes the model; it does NOT configure credentials.
# No plan-mode routing here: the primary agent's model is the session model and
# holds for the whole run, so planner and builder share it by construction.
OC_MAIN_MODEL="deepseek/deepseek-v4-pro"
OC_CRITIC_MODEL="deepseek/deepseek-v4-pro"
