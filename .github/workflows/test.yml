name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The suite runs its Layer 0 half under both a C and a UTF-8 locale, and
      # discovers which UTF-8 locale exists rather than assuming en_US.UTF-8.
      # Ubuntu runners do not always have it, and asking for a missing locale
      # falls back to C silently -- which is exactly how the close-banner regex
      # stayed green in CI while being dead in production.
      - name: locales available
        run: locale -a | grep -i utf | head -5 || true
      # The OpenCode adapter runs inside OpenCode's Bun, so Bun is what tests
      # it. test.sh FAILS without Bun rather than skipping: a translator nobody
      # ran, reported green, is the false green this suite exists to refuse.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: test suite
        run: ./test.sh

  # Static checks, separate from the behavioural suite above: a script can pass
  # every test and still be one untested branch away from a syntax error, or
  # rely on a pattern that only works by accident (SC2295 was exactly that --
  # a real bug in hk_rel_path, unquoted glob expansion, found by running
  # shellcheck locally rather than by any test failing). `-x` follows sourced
  # files (lib.sh, models.conf) so their own content is checked too, not just
  # the `.` line. Everything left unflagged is either fixed or has an inline
  # `# shellcheck disable=` directive naming why it is intentional.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n on every script this project ships
        run: |
          for f in hooks/*.sh install.sh uninstall.sh test.sh test-hooks.sh; do
            bash -n "$f" || { echo "::error file=$f::fails to parse"; exit 1; }
          done
      - name: shellcheck, source-following, at style severity
        run: shellcheck -x --shell=bash --severity=style hooks/*.sh install.sh uninstall.sh test.sh test-hooks.sh

  # PROJECT.md claims bash 3.2 compatibility (the macOS system shell). `env bash`
  # on a runner can resolve to a newer Homebrew bash, which would let a bashism
  # pass unnoticed. Force the system shell so the claim is actually tested.
  bash32:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash version in use
        run: /bin/bash --version | head -1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: test suite under /bin/bash
        run: /bin/bash ./test.sh
